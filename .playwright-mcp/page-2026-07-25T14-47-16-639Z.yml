        - heading "Our Programs" [level=2] [ref=f2e224]
      - link "View all programs" [ref=f2e225] [cursor=pointer]:
        - /url: /mentorship
    - paragraph [ref=f2e229]: Our projects are designed to meet Afghan girls where they are—and help them grow into who they're meant to be. Each initiative provides a safe, inclusive space where participants gain the tools, guidance, and community they need to rise. From leadership workshops to storytelling programs, every project builds confidence, sharpens skills, and encourages bold self-expression. Together, we're creating spaces where Afghan girls can learn, lead, and shape their own futures.
