  - generic [ref=f2e183]:
    - paragraph [ref=f2e184]: Message From Our Co-Founders
    - heading "We see you. We hear you. And we are with you." [level=2] [ref=f2e185]
    - generic [ref=f2e186]:
      - paragraph [ref=f2e187]: EmpowerHer was born from the hope and strength that you carry within you—even in the darkest of days. You are not forgotten. Your dreams, your voices, your potential—they matter. They are powerful, and they are needed in this world.
      - paragraph [ref=f2e188]: We know that many of you are facing unimaginable challenges. Barriers to education, threats to your freedom, and a world that too often refuses to see your worth. But we believe in your resilience. And through EmpowerHer, we are building a path forward—together.
      - paragraph [ref=f2e189]: "Our mission is simple: to support you, to uplift you, and to walk beside you. Whether through education, mentorship, leadership workshops, or simply being a voice when yours is silenced, we are here for you."
      - paragraph [ref=f2e190]: Please don't give up. There is a growing community—inside and outside Afghanistan—that believes in your power to lead, to learn, and to rise. And we are proud to stand with you.
    - generic [ref=f2e191]:
      - paragraph [ref=f2e192]: Mahdi Rahimi & Nahid Karimi
      - paragraph [ref=f2e193]: – Co-Founders
