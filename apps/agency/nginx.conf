server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip text assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # hashed build assets — immutable, cache hard
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Astro build.format "file": /pricing -> /pricing.html (flat files, clean URLs)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # custom 404 (Astro emits 404.html)
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
